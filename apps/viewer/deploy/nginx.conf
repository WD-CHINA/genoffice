# 贴进站点的 server 块，或在宝塔「网站 → 配置文件」中合并。
# root 指到发布目录 apps/viewer/releases/genoffice-viewer。
#
# /assets/ 下的 js、css、字体文件名带内容 hash。文件内容不变，名字就不变，
# 可以缓存一年。index.html 和 preview.html 不缓存，发布后浏览器才会拿到新的 hash 地址。
# woff2 本身已压缩，不要再 gzip。ttf、js、css、wasm 使用同目录下预先生成的 .gz。

gzip on;
gzip_static on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/wasm
    image/svg+xml
    font/ttf
    font/otf
    application/font-sfnt
    application/octet-stream;

location = /index.html {
    add_header Cache-Control "no-cache";
}

location = /preview.html {
    add_header Cache-Control "no-cache";
}

location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location /pdfjs/ {
    add_header Cache-Control "public, max-age=604800";
}
